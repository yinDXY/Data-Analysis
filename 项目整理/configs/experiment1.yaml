# A+B+C 增强实验配置
data_dir: ../dataset/chest_xray
model_name: densenet121
epochs: 100
batch_size: 64
lr: 0.0001
weight_decay: 0.0001
num_workers: 0
val_strategy: split_train
val_ratio: 0.15
threshold: 0.5
seed: 42
output_dir: results_modules/A+B+C/densenet_enhanced

augment: true
cutout: true
cutout_size: 64
mixup_alpha: 0.2

freeze_epochs: 0
last_block_epochs: 0
finetune_lr: -1

loss_name: bce_soft_mcc
bce_weight: 1.0
mcc_weight: 1.0

use_wtconv: true
use_ema: true

